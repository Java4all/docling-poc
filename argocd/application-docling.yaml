apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docling
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rancher-poc
  source:
    repoURL: https://github.com/Java4all/docling-poc
    targetRevision: main
    path: apps/docling
  destination:
    # Use the exact cluster "name" shown under Settings > Clusters in the Argo CD UI.
    # If your cluster is only listed by server URL there, replace this with:
    #   server: https://<the-exact-url-shown-in-the-UI>
    name: rancher-poc-rke2
    namespace: docling
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
