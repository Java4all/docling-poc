apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docling
  namespace: docling
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - docling.apps.rancher-poc.ad.curia.europa.eu
      secretName: wildcard-docling-poc
  rules:
    - host: docling.apps.rancher-poc.ad.curia.europa.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docling-serve
                port:
                  number: 5001
